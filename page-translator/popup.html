<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>一键网页翻译</title></head>
<body>
  <header><span class="badge">译</span><div><h1>一键网页翻译</h1><p>整个网页 · 简体中文</p></div></header>
  <button id="translate" class="primary">翻译全部文本</button>
  <button id="restore">恢复原文</button>
  <label for="source">原文语言</label>
  <select id="source"><option value="auto">自动检测</option><option value="en">英语</option><option value="ja">日语</option><option value="ko">韩语</option><option value="de">德语</option><option value="fr">法语</option><option value="es">西班牙语</option><option value="ru">俄语</option></select>
  <label><input id="floating" type="checkbox" checked>在网页显示一键翻译按钮</label>
  <p id="status" role="status"></p>
  <footer>使用浏览器本地模型，无需 API 密钥，网页文本不发送到翻译服务器。首次使用请直接点击网页左下角按钮下载模型。输入内容、代码和图片文字不参与翻译。</footer>
  <script src="popup.js"></script>
</body>
</html>
