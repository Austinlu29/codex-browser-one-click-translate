<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>一键网页翻译</title></head>
<body>
  <header><img class="badge" src="icons/icon-48.png" width="44" height="44" alt="蓝底白色 T 图标"><div><h1>一键网页翻译</h1><p id="direction">英语 → 简体中文</p></div></header>
  <div class="languages">
    <div><label for="source">原文语言</label><select id="source" aria-label="原文语言"></select></div>
    <button id="swap" class="swap" title="交换原文与目标语言" aria-label="交换语言">⇄</button>
    <div><label for="target">目标语言</label><select id="target" aria-label="目标语言"></select></div>
  </div>
  <p class="hint">语言组合由浏览器本地模型支持；首次使用可能需下载。</p>
  <button id="translate" class="primary">翻译全部文本</button>
  <button id="restore">恢复原文</button>
  <label><input id="floating" type="checkbox" checked>在网页显示一键翻译按钮</label>
  <p id="status" role="status"></p>
  <footer>使用浏览器本地模型，无需 API 密钥，网页文本不发送到翻译服务器。首次使用请直接点击网页左下角按钮下载模型。输入内容、代码和图片文字不参与翻译。</footer>
  <script src="languages.js"></script><script src="popup.js"></script>
</body>
</html>
